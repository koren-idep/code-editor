name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Linux code-editor verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/koren-code/frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: Install frontend dependencies
        run: npm ci --prefix apps/koren-code/frontend
      - name: Run frontend and Rust checks
        run: |
          npm test --prefix apps/koren-code/frontend
          cargo fmt --check
          cargo build --workspace --locked
          cargo test --workspace --locked
          xvfb-run -a cargo run --locked -p koren-native -- --smoke .
